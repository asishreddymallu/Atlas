# .github/workflows/release.yml
#
# Builds the standalone packages with scripts/package_linux.sh and
# scripts/package_windows.ps1, smoke-checks each with scripts/check_package.*,
# and uploads them as workflow artifacts. A version tag (v*) also publishes
# them to a GitHub Release. See CONTRIBUTING.md, "Cutting a release".

name: Packages

on:
  push:
    branches:
      - final/package
      - final/submission
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The lowest Qt the root CMakeLists.txt accepts (find_package(Qt6 6.9.2 ...)).
  QT_VERSION: '6.9.2'

jobs:
  linux:
    # The oldest supported runner: the package needs this glibc or newer.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the version carries the commit hash

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-12 libgl1-mesa-dev libegl1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libfontconfig1 libdbus-1-3

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Build and package
        env:
          # GCC 12: fuller C++20 than 22.04's default GCC 11, and its
          # libstdc++ is the one 22.04 itself ships.
          CC: gcc-12
          CXX: g++-12
        run: scripts/package_linux.sh

      - name: Check the AppImage
        run: scripts/check_package.sh dist/Atlas-*-x86_64.AppImage

      - name: Check the tar.gz
        run: scripts/check_package.sh dist/Atlas-*-linux-x86_64.tar.gz

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: atlas-linux-x86_64
          path: |
            dist/Atlas-*-x86_64.AppImage
            dist/Atlas-*-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Qt and MinGW 13.1
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          # Qt 6.9.2's MinGW build is compiled with MinGW 13.1: the same
          # compiler keeps the C++ ABI and runtime DLLs matched.
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Put MinGW and Ninja on PATH
        run: |
          $mingw = Join-Path $env:IQTA_TOOLS 'mingw1310_64\bin'
          if (-not (Test-Path (Join-Path $mingw 'g++.exe'))) { throw "no g++ in $mingw" }
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          python -m pip install ninja

      - name: Build and package
        env:
          CC: gcc
          CXX: g++
        run: |
          g++ --version
          ./scripts/package_windows.ps1

      - name: Check the zip
        run: |
          $zip = Get-ChildItem dist/Atlas-*-windows-x64.zip | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP 'atlas-check'
          Expand-Archive -Path $zip.FullName -DestinationPath $dest
          ./scripts/check_package.ps1 (Join-Path $dest $zip.BaseName)

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: atlas-windows-x64
          path: dist/Atlas-*-windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: dist/*
          fail_on_unmatched_files: true
